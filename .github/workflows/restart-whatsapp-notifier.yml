name: Restart WhatsApp Notifier

on:
  workflow_dispatch:
  schedule:
    # 06:00 and 18:00 AEST (UTC+10)
    - cron: '0 20,8 * * *'

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restart Fly app
        run: flyctl apps restart surf-tracker-whatsapp-notifier
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
