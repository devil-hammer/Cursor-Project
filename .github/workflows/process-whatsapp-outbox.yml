name: Process WhatsApp Outbox

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run short-lived outbox processor
        run: |
          IMAGE=$(flyctl image show -a surf-tracker-whatsapp-notifier -j | jq -r '.[0].Tag')
          flyctl machine run "$IMAGE" \
            --app surf-tracker-whatsapp-notifier \
            --region iad \
            --volume whatsapp_data:/data \
            --vm-memory 2048 \
            --rm \
            --restart no \
            node process-outbox.js
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
