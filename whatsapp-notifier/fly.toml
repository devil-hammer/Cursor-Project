# fly.toml app configuration file generated for surf-tracker-whatsapp-notifier on 2026-01-27T15:55:25+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'surf-tracker-whatsapp-notifier'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  WHATSAPP_GROUP_NAME = 'Semi-kooks'
  WHATSAPP_GROUP_ID = '61423185452-1418503698@g.us'
  WHATSAPP_GROUP_INVITE_CODE = 'KPTHNilPFN82sxpIPWGzT7'
  WHATSAPP_AUTH_PATH = '/data/.wwebjs_auth'

[[mounts]]
  source = 'whatsapp_data'
  destination = '/data'

# No always-on HTTP service. GitHub Actions runs short-lived machines via
# `fly machine run` to process the DB outbox on a schedule.

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
